<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 1 Review Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b2a2e; --white:#fff; --rule:#d9dee0; --card:#f2f4f5;
  --head:#00c2d4; --tint:#e6f9fb; --off:#8ae4ec; --accent:#fb5959; --accent-txt:#b8282a;
  --yellow:#ffd032; --orange:#fc7d4b; --coral:#fb5959;
  --right:#1f9d55; --right-bg:#e3f6ea; --wrong:#c62828; --wrong-bg:#fde8e8;
}
*{box-sizing:border-box}
body{margin:0;background:#eef1f2;color:var(--ink);font-family:'Montserrat','Segoe UI',Arial,Helvetica,sans-serif;line-height:1.45}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.game{background:var(--white);box-shadow:0 1px 0 var(--rule)}
header{background:var(--head);padding:18px 22px 16px;display:flex;gap:16px;align-items:flex-end;justify-content:space-between}
.steps{display:flex;gap:4px;align-items:center;margin:0 0 8px}
.steps span{width:22px;height:6px;background:var(--off)}
.steps span.on{background:var(--ink)}
.steps b{font-size:12px;margin-left:6px;white-space:nowrap}
.kicker{margin:0 0 4px;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
h1{margin:0;font-size:28px;line-height:1.15;font-weight:900;text-transform:uppercase}
.badge{background:var(--ink);color:var(--white);font-weight:700;font-size:15px;padding:6px 12px;white-space:nowrap}
.stage{position:relative;overflow:hidden;min-height:420px}
.screen{--rc:var(--head);--rt:var(--tint);--ra:var(--accent);--rat:var(--accent-txt);padding:22px;transition:transform .35s ease,opacity .35s ease}
.screen.enter{transform:translateX(70px);opacity:0}
.screen.leave{position:absolute;top:0;left:0;right:0;transform:translateX(-70px);opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.screen{transition:none}}
.label{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.label.accent{color:var(--rat)}
.idea{background:var(--rt);border-left:6px solid var(--rc);padding:16px 20px;margin:0 0 18px}
.idea p{margin:0;font-size:16px}
.prompt{border-left:6px solid var(--ra);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:16px 20px;margin:0 0 16px}
.prompt .q{margin:0;font-size:19px;font-weight:700;line-height:1.45}
.count{font-size:13px;font-weight:700;color:#4a5a5e;margin:0 0 10px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:620px){.opts.three{grid-template-columns:1fr}}
button{font:inherit;color:inherit;cursor:pointer}
.opt{background:var(--card);border:2px solid transparent;border-top:4px solid var(--rc);padding:14px 16px;font-size:16px;font-weight:700;text-align:left;min-height:56px}
.opt:hover:not(:disabled){border-color:var(--ink);border-top-color:var(--ink)}
.opt:focus-visible,.btn:focus-visible,.chip:focus-visible,.idea-card:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.opt:disabled{cursor:default}
.opt.right{background:var(--right-bg);border-color:var(--right);border-top-color:var(--right)}
.opt.wrong{background:var(--wrong-bg);border-color:var(--wrong);border-top-color:var(--wrong)}
.opt.dim{opacity:.55}
.feedback{margin:16px 0 0;padding:14px 18px;background:var(--card);border-left:6px solid var(--ink);font-size:15px}
.feedback strong{display:block;font-size:16px;margin-bottom:2px}
.feedback.ok{border-left-color:var(--right)} .feedback.no{border-left-color:var(--wrong)}
.row{display:flex;justify-content:flex-end;margin-top:16px;gap:10px;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--white);border:0;padding:12px 20px;font-weight:700;font-size:16px}
.btn.ghost{background:var(--white);color:var(--ink);border:2px solid var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
/* matching */
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:0 0 16px}
@media (max-width:700px){.chips{grid-template-columns:repeat(3,1fr)}}
.chip{background:var(--white);border:3px solid var(--ink);padding:0;display:flex;flex-direction:column;overflow:hidden;text-align:center;transition:transform .15s}
.chip:hover:not(:disabled){transform:translateY(-2px)}
.chip .ph{display:block;width:100%;aspect-ratio:22/25;object-fit:cover;background:var(--white)}
.chip .ph.init{display:flex;align-items:center;justify-content:center;background:var(--rt);font-size:34px;font-weight:900;color:var(--ink);letter-spacing:1px}
.chip .nm{display:block;background:var(--ink);color:var(--white);padding:7px 4px 6px;font-weight:700;font-size:13px;line-height:1.2;flex:1}
.chip .nm small{display:block;font-weight:600;font-size:10.5px;letter-spacing:.5px;opacity:.85;margin-top:2px}
.chip.sel{border-color:var(--rc);box-shadow:0 0 0 3px var(--rc);transform:translateY(-3px)}
.chip.sel .nm{background:var(--rc);color:var(--ink)}
.chip.done{border-color:var(--right);cursor:default}
.chip.done .nm{background:var(--right-bg);color:var(--ink)}
.chip.done .ph{opacity:.6}
.chip.shake,.idea-card.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ideas{display:grid;gap:8px}
.idea-card{background:var(--card);border:2px solid transparent;border-left:6px solid var(--rc);padding:12px 14px;text-align:left;font-size:15px}
.idea-card:hover:not(:disabled){border-color:var(--ink)}
.idea-card.sel{border-color:var(--ink);background:var(--rt)}
.idea-card.done{background:var(--right-bg);border-color:var(--right);border-left-color:var(--right);cursor:default}
.idea-card.bad{background:var(--wrong-bg);border-color:var(--wrong)}
.idea-card .who img{width:30px;height:34px;object-fit:cover;vertical-align:middle;margin-right:8px;border:1px solid var(--rule)}
.idea-card .who{display:block;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:1px;margin-top:6px}
/* start + final */
.field{display:grid;gap:6px;margin:0 0 16px}
.field input{font:inherit;font-size:17px;padding:12px 14px;border:2px solid var(--ink)}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
@media (max-width:620px){.cards3{grid-template-columns:1fr}}
.card{background:var(--card);border-top:4px solid var(--head);padding:12px 14px}
.card b{display:block;font-size:15px;margin-bottom:4px}
.card span{font-size:14px}
.boxes{display:flex;gap:12px;margin:6px 0 18px;flex-wrap:wrap}
.box{width:96px;height:96px;border:3px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--white)}
.box .chk{font-size:44px;line-height:1;color:var(--right);font-weight:900}
.box .n{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#4a5a5e}
.box .s{font-size:13px;font-weight:700}

.final-top{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.big{background:var(--ink);color:var(--white);padding:16px 22px;text-align:center;min-width:170px}
.big .num{font-size:54px;font-weight:900;line-height:1}
.big .of{font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--head)}
.who-line{font-size:20px;font-weight:900;margin:0 0 2px}
.stamp{font-size:14px;color:#4a5a5e;margin:0}
table.breakdown{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:15px}
.breakdown td{padding:8px 10px;border-bottom:1px solid var(--rule)}
.breakdown td:last-child{text-align:right;font-weight:700}
.note{font-size:14px;font-style:italic;margin:0 0 6px}
/* class 4-color stripe */
.stripe{display:grid;grid-template-columns:repeat(4,1fr);height:8px}
.stripe i:nth-child(1){background:var(--head)}.stripe i:nth-child(2){background:var(--yellow)}.stripe i:nth-child(3){background:var(--orange)}.stripe i:nth-child(4){background:var(--coral)}
.rband{background:var(--rc);margin:-22px -22px 18px;padding:22px 22px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.rband .rn{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin:0 0 4px}
.rband h2{margin:0;font-size:32px;font-weight:900;text-transform:uppercase;line-height:1.1}
.rband .pts{background:var(--ink);color:var(--white);font-weight:700;font-size:15px;padding:6px 12px;white-space:nowrap}
.rpill{display:inline-block;width:12px;height:12px;background:var(--rc);margin-right:8px;vertical-align:-1px}
.cards3 .card:nth-child(1){border-top-color:var(--yellow)}.cards3 .card:nth-child(2){border-top-color:var(--orange)}.cards3 .card:nth-child(3){border-top-color:var(--coral)}
.box.on:nth-child(1){background:var(--yellow)}.box.on:nth-child(2){background:var(--orange)}.box.on:nth-child(3){background:var(--coral)}
.box.on{border-color:var(--ink)} .box.on .chk{color:var(--ink)}
.breakdown td:first-child::before{content:"";display:inline-block;width:12px;height:12px;margin-right:10px;vertical-align:-1px;background:var(--c)}
footer{background:var(--ink);color:var(--white);padding:14px 22px;font-size:16px}
footer strong{color:var(--head)}
</style>
</head>
<body>
<div class="wrap">
  <div class="game">
    <header>
      <div>
        <div class="steps" id="steps" aria-hidden="true"></div>
        <p class="kicker">Unit 1 &middot; Review Game</p>
        <h1>Thinking Like a Sociologist</h1>
      </div>
      <div class="badge" id="badge" aria-live="polite">20&nbsp;pts</div>
    </header>
    <div class="stripe" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <main class="stage" id="stage"></main>
    <footer><strong>Play it three times.</strong> The questions shuffle every game, and every round makes the ideas stick a little better.</footer>
  </div>
</div>

<script>
/* ---------- CONTENT (Super Deck Unit 1 + SOC 7 wording) ---------- */
const ROUNDS = [
  {
    id:'mm', c:['var(--head)','var(--tint)','var(--accent)','var(--accent-txt)'], type:'mc', pick:4, layout:'two', fixedOpts:['Micro','Macro'],
    title:'Micro or Macro?',
    idea:'<b>Macro</b> sociology looks at the big picture: social structure, patterns and trends across a whole society. <b>Micro</b> sociology zooms in on face-to-face interaction and everyday life.',
    pool:[
      {q:'Do people of different races in the U.S. have different life expectancies?', a:'Macro', why:'Life expectancy is a pattern across a whole population.'},
      {q:'Do doctors treat patients of different races differently during an exam?', a:'Micro', why:'This is about what happens inside one interaction between two people.'},
      {q:'How did the shift from farm work to factory work change family size?', a:'Macro', why:'It is a society-wide change in social structure over time.'},
      {q:'How do students decide where to sit in the cafeteria on the first day of school?', a:'Micro', why:'It is about small, everyday choices made face to face.'},
      {q:'Why is the divorce rate in the U.S. higher than in Japan?', a:'Macro', why:'It compares patterns across two entire societies.'},
      {q:'How do two strangers in an elevator avoid making eye contact?', a:'Micro', why:'It is the small, unwritten rules of a single interaction.'},
      {q:'How does the national unemployment rate affect how many people get married?', a:'Macro', why:'Both are trends measured across a whole society.'},
      {q:'How does a new student figure out the unwritten rules of a classroom?', a:'Micro', why:'It is one person learning through everyday interaction.'}

      {name:'Karl Marx', years:'1818–1883', idea:'Argued society is always defined by a struggle between classes, with the ruling class working to keep its power.', theory:'Social conflict theory'},

    title:'Which Lens?',
    idea:'Each paradigm asks a different kind of question. <b>Functionalism:</b> how does this help society stay stable? <b>Conflict:</b> who has power, and who benefits? <b>Symbolic interactionism:</b> what do people\u2019s symbols and labels mean, and how do they shape behavior?',
    pool:[
      {q:'How does school keep society stable by teaching everyone the same values?', a:'Structural Functionalism', why:'It asks how school helps society keep running smoothly.'},
      {q:'Does school help wealthy families keep their advantage over poor families?', a:'Social Conflict', why:'It asks who benefits and who holds power.'},
      {q:'How do labels like "nerd," "jock" or "troublemaker" shape how students act?', a:'Symbolic Interactionism', why:'It asks how labels and shared meanings shape behavior.'},
      {q:'What purpose does a graduation ceremony serve for the whole community?', a:'Structural Functionalism', why:'It looks for the function a pattern serves.'},
      {q:'Why do men still hold most CEO jobs at large companies?', a:'Social Conflict', why:'It looks at unequal power between groups (gender conflict theory sits under this lens).'},
      {q:'How do two friends decide what a thumbs-up emoji means in a text?', a:'Symbolic Interactionism', why:'It is about people creating shared meaning through symbols.'},
      {q:'How do families help society by raising children who follow the rules?', a:'Structural Functionalism', why:'It asks how one part of society keeps the whole stable.'},
      {q:'Who benefits when rent rises faster than wages?', a:'Social Conflict', why:'It asks how resources are unevenly distributed.'},
      {q:'How does a new employee figure out what "business casual" means at their job?', a:'Symbolic Interactionism', why:'It is about interpreting symbols in everyday interaction.'}
    ]
  },
  {
    id:'tool', c:['var(--coral)','#ffecec','var(--head)','#00727c'], type:'mc', pick:5, layout:'list', shuffleOpts:true,
    title:'The Sociologist\u2019s Toolkit',
    idea:'Put the Unit 1 vocabulary to work: functions and dysfunctions, research methods and the sociological perspective.',
    pool:[
      {q:'College is meant to prepare students for a career. What kind of function is that?', opts:['Manifest function','Latent function','Social dysfunction'], a:'Manifest function', why:'It is the recognized and intended purpose of college.'},
      {q:'Many people meet their future spouse in college, even though that\u2019s not why college exists. What kind of function is that?', opts:['Latent function','Manifest function','Social dysfunction'], a:'Latent function', why:'It is an unintended consequence of a social pattern.'},
      {q:'A social pattern that disrupts how society operates is called a\u2026', opts:['Social dysfunction','Latent function','Manifest function'], a:'Social dysfunction', why:'Dysfunctions work against stability instead of for it.'},
      {q:'A researcher moves into a neighborhood for a year and keeps detailed notes on everyday life there. Which method is this?', opts:['Ethnography / field observation','Survey','Experiment','Case study'], a:'Ethnography / field observation', why:'Embedding yourself long-term in a field site and documenting daily life is ethnography.'},
      {q:'2,000 teens answer the same questionnaire about their phone habits. Which method is this?', opts:['Survey','Ethnography / field observation','Experiment','Case study'], a:'Survey', why:'Surveys collect answers to a set of questions about behaviors and opinions.'},
      {q:'A researcher splits volunteers into two groups, changes one thing for one group and controls everything else. Which method is this?', opts:['Experiment','Survey','Case study','Ethnography / field observation'], a:'Experiment', why:'Experiments are designed so variables can be controlled.'},
      {q:'A researcher studies one small town in depth after its only factory closed. Which method is this?', opts:['Case study','Survey','Experiment','Ethnography / field observation'], a:'Case study', why:'A case study relies on a single case rather than a sample of a population.'},
      {q:'A sociologist studies high school students in one city and draws conclusions about American teens. This is\u2026', opts:['Finding the general in the particular','Finding the peculiar in the ordinary','Cultural relativism'], a:'Finding the general in the particular', why:'It looks for general patterns in a particular group.'},
      {q:'A sociologist watches a school lunch line as if she had never seen one, noticing rules everyone else takes for granted. This is\u2026', opts:['Finding the peculiar in the ordinary','Finding the general in the particular','Cultural relativism'], a:'Finding the peculiar in the ordinary', why:'She is looking at the familiar with "fresh eyes."'},
      {q:'Compared with psychology, sociology is more interested in\u2026', opts:['Group behavior and social patterns','The individual mind','Markets and prices','Past cultures'], a:'Group behavior and social patterns', why:'Psychology focuses more on the individual; sociology on groups and society.'}
    ]
  }
];

};
const TOTAL = 20; // 4 + 6 + 5 + 5
const STORE = 'soc-unit1-review-attempts';
const NAMEKEY = 'soc-review-name';

/* ---------- STORAGE (safe) ---------- */
let memAttempts = [];
function loadAttempts(){ try{ const v=JSON.parse(localStorage.getItem(STORE)||'[]'); return Array.isArray(v)?v:[]; }catch(e){ return memAttempts; } }
function saveAttempts(a){ memAttempts=a; try{ localStorage.setItem(STORE,JSON.stringify(a)); return true; }catch(e){ return false; } }
function loadName(){ try{ return localStorage.getItem(NAMEKEY)||''; }catch(e){ return ''; } }
function saveName(n){ try{ localStorage.setItem(NAMEKEY,n); }catch(e){} }

/* ---------- HELPERS ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const stage = $('#stage');
let current = null;
function show(html,c){
  const el=document.createElement('section'); el.className='screen enter'; el.innerHTML=html;
  if(c){ ['--rc','--rt','--ra','--rat'].forEach((v,i)=>el.style.setProperty(v,c[i])); }
  stage.appendChild(el); void el.offsetWidth; el.classList.remove('enter');
  if(current){ const old=current; old.classList.add('leave'); setTimeout(()=>old.remove(),380); }
  current=el; window.scrollTo({top:0,behavior:'smooth'});
  const f=el.querySelector('[data-focus]'); if(f) setTimeout(()=>f.focus({preventScroll:true}),360);
  return el;
}
function setSteps(n){ // n = rounds finished/active (0-4)
  $('#steps').innerHTML = ROUNDS.map((_,i)=>`<span class="${i<n?'on':''}"></span>`).join('') + `<b>${n?`Round ${Math.min(n,4)} of 4`:'4 rounds'}</b>`;
}
function setBadge(){ $('#badge').innerHTML = game ? `${game.score}&nbsp;/&nbsp;${TOTAL}` : `${TOTAL}&nbsp;pts`; }
function portrait(it,cls){ const src=PORTRAITS[it.name];
  if(src) return `<img class="${cls}" src="${src}" alt="Portrait of ${esc(it.name)}">`;
  const ini=it.name.split(/\s+/).map(w=>w[0]).join('').replace(/[^A-ZÉ]/g,'').slice(0,2);
  return cls==='ph' ? `<span class="ph init" aria-hidden="true">${ini}</span>` : ''; }
function boxesHTML(attempts){
  return [0,1,2].map(i=>{ const a=attempts[i];
    return `<div class="box ${a?'on':''}" aria-label="Attempt ${i+1} ${a?'done, score '+a.score:'not done'}">
      ${a?`<span class="chk">&#10003;</span><span class="s">${a.score} / ${TOTAL}</span>`:`<span class="n">Play ${i+1}</span>`}</div>`; }).join('');
}

/* ---------- GAME STATE ---------- */
let game = null;

function startScreen(){
  game=null; setSteps(0); setBadge();
  const att=loadAttempts(); const done=Math.min(att.length,3);
  show(`
    <div class="idea"><p class="label">How it works</p><p>Four short rounds on Unit 1. Each answer is worth 1 point, for <b>${TOTAL} points</b> per game. Questions shuffle every time you play.</p></div>
    <div class="cards3">
      <div class="card"><b>1. Play</b><span>Answer each question. You'll see the right answer and why after each one.</span></div>
      <div class="card"><b>2. Screenshot</b><span>When you finish, screenshot the final score page.</span></div>
      <div class="card"><b>3. Three times</b><span>Fill all three boxes, then upload your screenshot to Canvas.</span></div>
    </div>
    <p class="label">Your plays so far &middot; ${done} of 3</p>
    <div class="boxes">${boxesHTML(att)}</div>
    <div class="field"><label class="label" for="nm">Your first and last name</label>
      <input id="nm" autocomplete="name" value="${esc(loadName())}" placeholder="First Last" data-focus></div>
    <div class="row"><button class="btn" id="go">Start game</button></div>`);
  const nm=current.querySelector('#nm'), go=current.querySelector('#go');
  const ok=()=>{ go.disabled = nm.value.trim().length<2; };
  nm.addEventListener('input',ok); ok();
  nm.addEventListener('keydown',e=>{ if(e.key==='Enter' && !go.disabled) go.click(); });
  go.onclick=()=>{ const n=nm.value.trim(); saveName(n);
    game={name:n, score:0, round:0, results:ROUNDS.map(r=>({title:r.title,got:0,of:0}))};
    roundIntro(0); };
}

function roundIntro(i){
  game.round=i; setSteps(i+1); setBadge();
  const r=ROUNDS[i];
  const n = r.type==='match' ? r.items.length : r.pick;
  show(`
    <div class="rband"><div><p class="rn">Round ${i+1} of 4</p><h2>${r.title}</h2></div><span class="pts">${n}&nbsp;pts</span></div>
    <div class="idea"><p class="label">The Idea</p><p>${r.idea}</p></div>
    <div class="row"><button class="btn" data-focus id="b">Let's go &rarr;</button></div>`, r.c);
  current.querySelector('#b').onclick=()=> r.type==='match' ? matchRound(i) : mcRound(i);
}

function mcRound(i){
  const r=ROUNDS[i]; const qs=shuffle(r.pool).slice(0,r.pick);
  game.results[i].of=qs.length;
  let k=0;
  const ask=()=>{
    const it=qs[k];
    const opts = r.fixedOpts ? r.fixedOpts : (r.shuffleOpts ? shuffle(it.opts) : it.opts);
    const cls = r.layout==='two'?'opts two':(r.layout==='three'?'opts three':'opts');
    show(`
      <p class="count"><span class="rpill"></span>Round ${i+1} &middot; ${r.title} &middot; Question ${k+1} of ${qs.length}</p>
      <div class="prompt"><p class="label accent">Your Question</p><p class="q">${esc(it.q)}</p></div>
      <div class="${cls}">${opts.map((o,j)=>`<button class="opt" data-o="${esc(o)}" ${j===0?'data-focus':''}>${esc(o)}</button>`).join('')}</div>
      <div id="fb" aria-live="polite"></div>
      <div class="row"><button class="btn" id="nx" hidden>${k+1<qs.length?'Next question &rarr;':(i+1<ROUNDS.length?'Next round &rarr;':'See my score &rarr;')}</button></div>`, r.c);
    current.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const pick=b.dataset.o, right=pick===it.a;
      current.querySelectorAll('.opt').forEach(x=>{ x.disabled=true;
        if(x.dataset.o===it.a) x.classList.add('right'); else if(x===b) x.classList.add('wrong'); else x.classList.add('dim'); });
      if(right){ game.score++; game.results[i].got++; setBadge(); }
      current.querySelector('#fb').innerHTML=`<div class="feedback ${right?'ok':'no'}"><strong>${right?'Correct!':'Not quite. It\u2019s '+esc(it.a)+'.'}</strong>${esc(it.why)}</div>`;
      const nx=current.querySelector('#nx'); nx.hidden=false; nx.focus();
      nx.onclick=()=>{ k++; if(k<qs.length) ask(); else next(i); };
    });
  };
  ask();
}

function matchRound(i){
  const r=ROUNDS[i]; game.results[i].of=r.items.length;
  const names=shuffle(r.items), ideas=shuffle(r.items);
  const state={sel:null, missed:new Set(), done:new Set()};
  show(`
    <p class="count"><span class="rpill"></span>Round ${i+1} &middot; ${r.title} &middot; Tap a face, then its idea</p>
    <div class="chips">${names.map((it,j)=>`<button class="chip" data-n="${esc(it.name)}" ${j===0?'data-focus':''}>${portrait(it,'ph')}<span class="nm">${esc(it.name)}<small>${it.years}</small></span></button>`).join('')}</div>
    <div class="ideas">${ideas.map(it=>`<button class="idea-card" data-n="${esc(it.name)}">${esc(it.idea)}</button>`).join('')}</div>
    <div id="fb" aria-live="polite"></div>
    <div class="row"><button class="btn" id="nx" hidden>Next round &rarr;</button></div>`, r.c);
  const el=current;
  const chips=[...el.querySelectorAll('.chip')], cards=[...el.querySelectorAll('.idea-card')];
  const fb=el.querySelector('#fb');
  chips.forEach(c=>c.onclick=()=>{ if(state.done.has(c.dataset.n)) return;
    chips.forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); state.sel=c.dataset.n; fb.innerHTML=''; });
  cards.forEach(card=>card.onclick=()=>{
    if(state.done.has(card.dataset.n)) return;
    if(!state.sel){ fb.innerHTML=`<div class="feedback"><strong>Pick a name first.</strong>Tap one of the portraits, then tap its idea.</div>`; return; }
    const chip=chips.find(x=>x.dataset.n===state.sel);
    if(card.dataset.n===state.sel){
      const it=r.items.find(x=>x.name===state.sel);
      state.done.add(state.sel);
      const first=!state.missed.has(state.sel);
      if(first){ game.score++; game.results[i].got++; setBadge(); }
      chip.classList.remove('sel'); chip.classList.add('done'); chip.disabled=true;
      card.classList.add('done'); card.disabled=true;
      card.insertAdjacentHTML('beforeend',`<span class="who">${portrait(it,'')}${esc(it.name)} &middot; ${esc(it.theory)}</span>`);
      fb.innerHTML=`<div class="feedback ok"><strong>${first?'Match! +1':'Match! (no point this time)'}</strong>${esc(it.name)} is linked to ${esc(it.theory.toLowerCase())}.</div>`;
      state.sel=null;
      if(state.done.size===r.items.length){ const nx=el.querySelector('#nx'); nx.hidden=false; nx.focus(); nx.onclick=()=>next(i); }
    } else {
      state.missed.add(state.sel);
      card.classList.add('bad','shake'); chip.classList.add('shake');
      setTimeout(()=>{ card.classList.remove('bad','shake'); chip.classList.remove('shake'); },500);
      fb.innerHTML=`<div class="feedback no"><strong>Not that one.</strong>${esc(state.sel)} can still be matched, but won't earn a point this game.</div>`;
    }
  });
}

function next(i){ if(i+1<ROUNDS.length) roundIntro(i+1); else finish(); }

function finish(){
  setSteps(4);
  const now=new Date();
  const att=loadAttempts();
  att.push({score:game.score, at:now.toISOString()});
  const stored=saveAttempts(att);
  const shown=att.slice(0,3);
  const playNo=att.length;
  const doneAll=att.length>=3;
  show(`
    <div class="final-top">
      <div class="big"><div class="num">${game.score}</div><div class="of">out of ${TOTAL}</div></div>
      <div>
        <p class="who-line">${esc(game.name)}</p>
        <p class="stamp">Unit 1 Review Game &middot; Play ${playNo}</p>
        <p class="stamp">${now.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})} &middot; ${now.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}</p>
      </div>
    </div>
    <p class="label">Your three plays</p>
    <div class="boxes">${boxesHTML(shown)}</div>
    <table class="breakdown">${game.results.map((r,j)=>`<tr><td style="--c:${ROUNDS[j].c[0]}">${esc(r.title)}</td><td>${r.got} / ${r.of}</td></tr>`).join('')}</table>
    <div class="idea" style="margin-bottom:0"><p>${doneAll
      ? '<b>All three boxes are checked.</b> Screenshot this page and upload it to Canvas.'
      : `<b>Screenshot this page,</b> then play again. ${3-att.length} more ${3-att.length===1?'play':'plays'} to fill every box.`}</p></div>
    ${stored?'':'<p class="note" style="margin-top:10px">This browser isn\u2019t saving your plays, so finish all three in one sitting without closing the tab.</p>'}
    <div class="row"><button class="btn" id="again" data-focus>${doneAll?'Play again for practice':'Play again &rarr;'}</button></div>`);
  current.querySelector('#again').onclick=()=>{ game=null; startScreen(); };
}

startScreen();
</script>
